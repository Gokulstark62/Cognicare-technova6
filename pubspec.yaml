name: elder_care_app
description: "CogniCare — Elder care app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # Fonts
  google_fonts: ^6.0.0

  # Localization (Phase 4)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.2.0

  # Voice Assistant (Phase 5)
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0
  flutter_tts: ^4.0.2

  # Database (Phase 6)
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true